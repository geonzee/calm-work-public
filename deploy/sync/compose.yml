name: calm-work-sync

# A new local server only. It has no hostname and no route to an existing machine.
# Keep the published port on 127.0.0.1. If that port is already taken, stop.
# Do not attach this file to containers or volumes you did not create for it.
# Image pin matches upstream.json. Full upstream compose:
# https://github.com/super-productivity/super-productivity/blob/v19.2.0/packages/super-sync-server/docker-compose.yml

services:
  sync:
    image: ghcr.io/super-productivity/supersync:v19.2.0
    container_name: calm-work-sync
    restart: unless-stopped
    init: true
    env_file:
      - path: .env
        required: true
    environment:
      NODE_ENV: production
      PORT: "1900"
      HOST: 0.0.0.0
      DATABASE_URL: postgresql://${POSTGRES_USER:-supersync}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-supersync}?connection_limit=10&pool_timeout=10
      REQUIRE_DATABASE_POOL_LIMITS: "true"
      RUN_MIGRATIONS_ON_STARTUP: "true"
      JWT_SECRET: ${JWT_SECRET}
      PUBLIC_URL: ${PUBLIC_URL:-http://127.0.0.1:1900}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://127.0.0.1:8080}
      ALLOWED_EMAILS: ${ALLOWED_EMAILS:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
    ports:
      - "127.0.0.1:1900:1900"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:1900/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 768m
    networks:
      - internal

  postgres:
    image: postgres:16-alpine
    container_name: calm-work-sync-postgres
    restart: unless-stopped
    init: true
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-supersync}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-supersync}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB""]
      interval: 10s
      timeout: 5s
      retries: 5
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    networks:
      - internal

networks:
  internal:

volumes:
  postgres-data:
